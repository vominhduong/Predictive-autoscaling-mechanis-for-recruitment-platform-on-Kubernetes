            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /readyz
              port: 8025
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /readyz
              port: 8025
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: recruitment
spec:
  type: ClusterIP
  selector:
    app: mailpit
  ports:
    - name: tcp-1025
      port: 1025
      targetPort: 1025
    - name: tcp-8025
      port: 8025
      targetPort: 8025
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: recruitment
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          imagePullPolicy: Always
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: recruitment-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recruitment-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_CV_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: MINIO_CV_BUCKET
          command:
            - /bin/sh
            - '-ec'
          args:
            - |-
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing "local/$MINIO_CV_BUCKET"
              mc anonymous set none "local/$MINIO_CV_BUCKET"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: recruitment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: vmduong2005/auth-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: recruitment-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recruitment-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: JWT_ISSUER
            - name: JWT_ACCESS_TOKEN_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: JWT_ACCESS_TOKEN_EXPIRATION
            - name: REFRESH_TOKEN_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: REFRESH_TOKEN_EXPIRATION
            - name: JWT_PRIVATE_KEY
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: JWT_PUBLIC_KEY
            - name: LOGGING_LEVEL_ROOT
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: LOGGING_LEVEL_ROOT
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: recruitment-config
                  key: JAVA_TOOL_OPTIONS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: jwt-keys
              mountPath: /run/keys
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            items:
              - key: dev-private.pem
                path: dev-private.pem
              - key: dev-public.pem
                path: dev-public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: recruitment
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: tcp-8081
      port: 8081
      targetPort: 8081
---

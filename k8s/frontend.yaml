apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: recruitment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: vmduong2005/frontend:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: recruitment
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: tcp-80
      port: 80
      targetPort: 8080

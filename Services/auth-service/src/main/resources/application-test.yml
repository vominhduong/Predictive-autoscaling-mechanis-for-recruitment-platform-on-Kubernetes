spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:1/auth_service_test}
    username: ${TEST_DB_USERNAME:test}
    password: ${TEST_DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
security:
  jwt:
    private-key: classpath:keys/test-private.pem
    public-key: classpath:keys/test-public.pem
